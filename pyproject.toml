[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "sphinx-fuma"
authors = [
    {name = "the sphinx-fuma authors", email = "t.paine154@gmail.com"},
]
description = "Fumadocs theme for sphinx"
readme = "README.md"
license = { text = "Apache-2.0" }
version = "0.1.0"
requires-python = ">=3.11"
keywords = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "sphinx>=7.2.6,<10",
    "sphinx-searchlite",
]

[project.entry-points."sphinx.html_themes"]
fuma = "sphinx_fuma"

[project.optional-dependencies]
develop = [
    "build",
    "bump-my-version",
    "check-dist",
    "codespell",
    "hatchling",
    "mdformat",
    "mdformat-tables>=1",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
    "ty",
    "uv",
    "wheel",
    # tests
    "myst-parser",
    "sphinx-design",
]

[project.scripts]

[project.urls]
Repository = "https://github.com/python-project-templates/sphinx-fuma"
Homepage = "https://github.com/python-project-templates/sphinx-fuma"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
commit_args = "-s"

[[tool.bumpversion.files]]
filename = "sphinx_fuma/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.coverage.run]
branch = true
omit = [
    "sphinx_fuma/tests/integration/",
]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true
fail_under = 50

[tool.hatch.build]
artifacts = []

[tool.hatch.build.sources]
src = "/"

[tool.hatch.build.targets.sdist]
packages = [
    "sphinx_fuma",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sphinx_fuma",
]

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
addopts = [
    "-vvv",
    "--junitxml=junit.xml",
]
testpaths = "sphinx_fuma/tests"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "sphinx_fuma",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

[tool.yardang]
title = "sphinx-fuma"
root = "README.md"
pages = [
    "docs/src/getting-started.md",
    "docs/src/theme-options.md",
    "docs/src/components.md",
]
use-autoapi = true
autoapi-ignore = ["*/tests/*"]
theme = "fuma"
myst-enable-extensions = [
    "amsmath",
    "colon_fence",
    "dollarmath",
    "fieldlist",
    "html_image",
]

[tool.yardang.html_theme_options]
announcement = "This documentation is built with sphinx-fuma."
color_preset = "amber"
footer_text = "Built with sphinx-fuma."
github_url = "https://github.com/python-project-templates/sphinx-fuma"
nav_links = [
    {title = "PyPI", url = "https://pypi.org/project/sphinx-fuma/"},
]
toc_style = "clerk"
